# What a tester gets besides the screenshots. `owner` is what the app's owner
# knows without looking anything up; `ui` explains the app's own symbols and is
# only handed to the "explained" variant, because whether the screens work
# without it is part of the test. build_brief.py fails when a tracked ticker is
# missing from `tickers`.

owner:
  context: >-
    Fibenchi is the owner's self-hosted watchlist of stocks, ETFs, indexes,
    commodities and crypto. The phone app shows the same watchlist. The owner
    is a retail investor based in Belgium, so EUR is the home currency and the
    European session (Xetra, Euronext, Borsa Italiana, LSE) is the main one.

  groups:
    Watchlist: Names the owner is considering or already holds, the general list.
    hotlist: The handful of names the owner is most actively watching this week.
    Crypto: Bitcoin, Ether and Solana against the US dollar.
    Sectors: >-
      One ETF per sector. The XDW*/XWTS ones are global (MSCI World) sector
      ETFs; ESIH, ESIN, SPYU and D5BK are European sector ETFs. Read together
      they show sector rotation.
    Thematic: Theme ETFs (batteries, drones, EVs, Korea, water, smart grid, space, nuclear, AI robotics, quantum, clean energy, semiconductors, uranium, cybersecurity, European defence).
    Indexes: Broad equity indexes, bond yields, the US dollar and USD/JPY. The market backdrop.
    Radar: Single stocks on the radar, not owned.
    Commodity ETCs: Exchange-traded commodities (soft commodities, copper, gold, natural gas).
    Doran: Two European car makers (BMW, Stellantis), a small list named after a person.
    El Nino: A trade idea on the El Niño weather pattern (sugar, a Florida home insurer, salmon farming).
    Claude Watchitems: Names an AI assistant flagged for the owner to watch.

  abbreviations:
    ETF: Exchange-traded fund.
    ETC: Exchange-traded commodity, a listed note tracking one commodity.
    UCITS: The EU fund regime; most European-listed ETFs carry it.
    "Ticker suffix": >-
      .DE Xetra (Germany), .MI Borsa Italiana, .L London, .PA Euronext Paris,
      .AS Euronext Amsterdam, .OL Oslo, .CO Copenhagen, .HK Hong Kong,
      .KS Korea. No suffix means a US listing.
    "^ prefix": An index, not something you can buy.
    "-USD": A crypto pair priced in US dollars, trades 24/7.
    "=X": A currency pair.
    "=F": A futures contract.
    "^TNX, ^FVX, ^TYX": US Treasury yields (10, 5 and 30 years), quoted in percent.
    DX-Y.NYB: The US Dollar Index (DXY), the dollar against a basket of major currencies.
    RSI: Relative Strength Index, 0 to 100. Above 70 is commonly read as overbought, below 30 as oversold.

