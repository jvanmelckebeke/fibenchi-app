ui:
  "σ (sigma), σ-Move": >-
    Today's move divided by that asset's own typical daily move (an
    exponentially weighted volatility). ±1σ is an ordinary day for that
    asset, ±2σ or more is a genuine surprise, whatever the headline %. In the
    owner's desktop app this column is called "vnr" (volatility-normalised return).
  Colours: Green is up, red is down. The stronger the colour, the larger the σ. Grey is close to zero.
  "Dot next to a ticker": Filled and pulsing means that asset's exchange is in its regular session and the data is fresh. Hollow means the exchange is closed, or the app's data is stale.
  "closed 17:30": The asset's exchange has closed for the day at that local time; the price and % are that session's close.
  "Row of small coloured bars": Every further asset, one bar each, coloured by its σ and ordered from largest |σ| down. "N more ›" opens the full list.
  "N of M scored": How many tracked assets have a σ right now. An asset without enough price history, or with a gap in its data, can't be scored.
  "Movers 1wk / 2wk / 1mo": The biggest gainers and losers over the past week, two weeks or month.
  "Board σ-Move / % today": Switches what the Board ranks and colours by.
  "Board All / Open": All tracked assets, or only those whose exchange is trading now.
